name: Spring Boot CI

on:
  push:
    branches:
    - '**'

  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Сборка и все тесты: в том числе проверка конфигурации (ApiKeysConfigTest).
      # Красный тест останавливает конвейер.
      - name: Build and test
        run: bash ./mvnw -B clean verify

      - name: Check version in jar
        run: |
          JAR=$(ls target/*-SNAPSHOT.jar | head -n 1)
          EXPECTED=$(git rev-parse --short=7 HEAD)
          ACTUAL=$(unzip -p "$JAR" BOOT-INF/classes/git.properties | grep '^git.commit.id.abbrev=' | cut -d= -f2)
          echo "jar=$JAR expected=$EXPECTED actual=$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"