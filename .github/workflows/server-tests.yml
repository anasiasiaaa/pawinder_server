name: Server tests

on:
  push:
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run PetSyncService tests
        working-directory: pawinder_server
        run: mvn -B test -Dtest=PetSyncServiceTest